title: Rotherham Bins
views:
  - title: Bins
    path: bins
    icon: mdi:trash-can-outline
    cards:
      - type: markdown
        title: Upcoming collections
        content: |
          {% set next_sensor = 'sensor.rotherham_bins_next_collection' %}
          {% set collections = state_attr(next_sensor, 'upcoming_collections') or [] %}
          {% if collections %}
          {% for collection in collections %}
          **{{ as_datetime(collection.date).strftime('%A %-d %B %Y') }}** - {{ collection.bin_type | title }}
          {% endfor %}
          {% else %}
          No upcoming collection data is available.
          {% endif %}

      - type: markdown
        title: Collection timing
        content: |
          {% set bins = [
            ('Black bin', 'sensor.rotherham_bins_black_bin_collection'),
            ('Green bin', 'sensor.rotherham_bins_green_bin_collection'),
            ('Pink bin', 'sensor.rotherham_bins_pink_bin_collection')
          ] %}
          {% for name, entity_id in bins %}
          {% set value = states(entity_id) %}
          {% if value not in ['unknown', 'unavailable', 'none'] %}
          {% set days = (as_datetime(value).date() - now().date()).days %}
          **{{ name }}** - {{ as_datetime(value).strftime('%A %-d %B %Y') }} ({{ 'today' if days == 0 else 'tomorrow' if days == 1 else 'in ' ~ days ~ ' days' if days > 1 else days|abs ~ ' days ago' }})
          {% else %}
          **{{ name }}** - unavailable
          {% endif %}
          {% endfor %}

      - type: entities
        title: Next collection by bin type
        entities:
          - entity: sensor.rotherham_bins_next_collection
            name: Any bin
            secondary_info: last-updated
          # Replace these example entities with the bin sensors created for your property.
          - entity: sensor.rotherham_bins_black_bin_collection
            name: Black bin
            secondary_info: last-updated
          - entity: sensor.rotherham_bins_pink_bin_collection
            name: Pink bin
            secondary_info: last-updated
          - entity: sensor.rotherham_bins_green_bin_collection
            name: Green bin
            secondary_info: last-updated
